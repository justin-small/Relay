version: 2
updates:
  # The desktop shell (#184). The Tauri crates and the Tauri CLI move together, so each ecosystem gets one group.
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ['tauri*']
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ['@tauri-apps/*']
  # The Python backend (requirements.txt). requirements-release.txt is generated with uv (see
  # requirements-release.in), so bump the pins here and regenerate it.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The workflows' actions (release.yml, tests.yml, firmware.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
