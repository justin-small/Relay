name: Tests

# Every pull request and every push to main runs the whole suite, including tests/test_modules.py, which
# enforces that each integration is a module that can be switched on and off (#157, docs/modules.md).
# Every tests/test_*.py file is picked up by itself (tests/run_all.py), so a new test file needs no change here.
# run_all.py runs the files several at a time and reports every failing file, not only the first.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The Python the app is developed and tested on.
          python-version: '3.15'
          cache: pip
      # sounddevice needs the PortAudio library to import (see release.yml for why PulseAudio runs headless).
      # A mirror outage makes apt retry every package until the job's limit; fail fast instead.
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 pulseaudio libasound2-dev
        timeout-minutes: 3
      - run: pulseaudio -D --exit-idle-time=-1 --load=module-null-sink && pactl info | head -3
      # httpx2 (starlette's TestClient), coverage and pytest are test-only, so they stay out of requirements.txt
      # and the release build.
      - run: pip install -r requirements.txt httpx2==2.13.1 coverage==7.16.2 pytest==9.2.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
      # The audio bus core (#601) and the NDI engine (#606) are Rust extensions the app imports; build and install them.
      - name: Build the Rust extensions
        run: python tools/build_bus_wheel.py
      # tests/test_rust_listeners.py runs the Rust server. Built inside the suite, a cold build (sqlite, argon2 and the rest) takes
      # most of the 300 seconds a test file gets and starves the tests running beside it, so it is built here first (cached).
      - name: Build the Rust server
        run: cargo build --locked -p relay-server
        working-directory: native
      - name: Module rule (every integration is a switchable module)
        run: python tests/test_modules.py
      - name: The whole suite, with coverage
        run: python tests/run_all.py --coverage --junit test-results.xml
      # .coveragerc sets fail_under: a change that leaves more of app/ untested than that fails here.
      - name: Coverage
        if: ${{ !cancelled() }}
        run: |
          coverage combine
          coverage report | tee coverage.txt
          { echo '### Coverage'; echo '```'; tail -1 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.txt
      # The browser-side scripts' own tests (node:test, no packages to install).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: JavaScript tests
        run: node --test tests/js/*.test.mjs     # Node 22 takes files, not a folder

  # The app now runs natively on each desktop OS (#180), so the suite runs on macOS and Windows too. A separate
  # job, not a matrix on the one above: main's branch protection requires the check named "Tests".
  desktop:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
      # No uvloop wheel for Windows (see the freeze spike, #179); requirements.txt skips it there.
      - run: pip install -r requirements.txt httpx2==2.13.1
        shell: bash
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
      # The audio bus core (#601) and the NDI engine (#606) are Rust extensions the app imports; build and install them.
      - name: Build the Rust extensions
        run: python tools/build_bus_wheel.py
        shell: bash
      # See the first job: the listeners test needs the server, and a cold build inside the suite starves the other tests.
      - name: Build the Rust server
        run: cargo build --locked -p relay-server
        working-directory: native
        shell: bash
      - name: The suite
        shell: bash
        run: python tests/run_all.py

  # The operator and viewer pages in headless Chromium (tests/test_browser.py; skipped in the jobs above, which do
  # not install Playwright). Its own job so a browser download problem never hides the suite's result.
  browser:
    name: Tests (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
      # sounddevice needs PortAudio and a running PulseAudio to import, as in the Tests job above.
      # A mirror outage makes apt retry every package until the job's limit; fail fast instead.
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 pulseaudio libasound2-dev
        timeout-minutes: 3
      - run: pulseaudio -D --exit-idle-time=-1 --load=module-null-sink && pactl info | head -3
      - run: pip install -r requirements.txt httpx2==2.13.1 playwright==1.65.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
      # The audio bus core (#601) and the NDI engine (#606) are Rust extensions the app imports; build and install them.
      - name: Build the Rust extensions
        run: python tools/build_bus_wheel.py
      - run: python -m playwright install --with-deps chromium-headless-shell
      - name: The pages in a browser
        run: python tests/test_browser.py

  # The desktop shell's own Rust unit tests (desktop/src-tauri). macOS, because on Linux the Tauri crates need
  # the WebKitGTK development packages just to compile.
  rust:
    name: Tests (desktop shell)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

  # Everything Rust under native/ is one Cargo workspace (#652): the audio bus (#601), the NDI engine (#606), the Relay
  # Helper (#497), the RF and front door spikes and the Rust server (relay-core, relay-server, modules/). The tests run on
  # fake devices and fake peers, so they need no sound hardware, NDI install or ProPresenter. All three platforms, because the
  # cpal backend and the helper differ per OS. Linux needs the ALSA headers for cpal to compile.
  # Not the wheel crates (relay-bus-py, relay-ndi-py) in cargo test: they have no Rust tests, and linking one needs libpython,
  # which a runner without Python set up may lack. The wheels are built and imported by the release build and every Python test job.
  native:
    name: Tests (Rust workspace, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
      - name: cargo clippy
        working-directory: native
        run: cargo clippy --locked --all-targets --workspace -- -D warnings
      - name: cargo test
        working-directory: native
        run: cargo test --locked --workspace --exclude relay-bus-py --exclude relay-ndi-py

  # Known vulnerabilities in what Relay ships: the Python backend (requirements.txt and the hash-pinned
  # release set) and the desktop shell's Rust crates and npm packages. Runs on every pull request, so a new
  # advisory against a pinned version shows up before the next release.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: pip-audit
        run: |
          pip install pip-audit==2.10.0
          pip-audit --strict -r requirements.txt
          pip-audit --strict --require-hashes --disable-pip -r requirements-release.txt
      - name: The release set matches requirements.txt
        run: python tests/test_release_lock.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: npm audit
        working-directory: desktop
        run: npm audit --audit-level=moderate
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # A prebuilt, checksum-checked binary: `cargo install` compiled it from source on every run (about 2 minutes).
      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.23.0
      - name: cargo audit
        working-directory: desktop/src-tauri
        run: cargo audit
      - name: cargo audit (native workspace)
        working-directory: native
        run: cargo audit
