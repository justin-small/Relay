name: Tests

# Every pull request and every push to main runs the whole suite, including tests/test_modules.py, which
# enforces that each integration is a module that can be switched on and off (#157, docs/modules.md).
# Every tests/test_*.py file is picked up by itself, so a new test file needs no change here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The Python the app is developed and tested on.
          python-version: '3.15'
          cache: pip
      # sounddevice needs the PortAudio library to import (see release.yml for why PulseAudio runs headless).
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 pulseaudio
      - run: pulseaudio -D --exit-idle-time=-1 --load=module-null-sink && pactl info | head -3
      # httpx2 is test-only (starlette's TestClient), so it stays out of requirements.txt and the release build.
      - run: pip install -r requirements.txt httpx2==2.13.1
      - name: Module rule (every integration is a switchable module)
        run: python tests/test_modules.py
      - name: The rest of the suite
        run: |
          set -e
          for t in tests/test_*.py tests/smoke_test.py; do
            [ "$t" = tests/test_modules.py ] && continue
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

  # The app now runs natively on each desktop OS (#180), so the suite runs on macOS and Windows too. A separate
  # job, not a matrix on the one above: main's branch protection requires the check named "Tests".
  desktop:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
      # No uvloop wheel for Windows (see the freeze spike, #179); requirements.txt skips it there.
      - run: pip install -r requirements.txt httpx2==2.13.1
        shell: bash
      - name: The suite
        shell: bash
        run: |
          set -e
          for t in tests/test_*.py tests/smoke_test.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

  # Known vulnerabilities in what Relay ships: the Python backend (requirements.txt and the hash-pinned
  # release set) and the desktop shell's Rust crates and npm packages. Runs on every pull request, so a new
  # advisory against a pinned version shows up before the next release.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: pip-audit
        run: |
          pip install pip-audit==2.10.0
          pip-audit --strict -r requirements.txt
          pip-audit --strict --require-hashes --disable-pip -r requirements-release.txt
      - name: The release set matches requirements.txt
        run: python tests/test_release_lock.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm audit
        working-directory: desktop
        run: npm audit --audit-level=moderate
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        working-directory: desktop/src-tauri
        run: |
          cargo install cargo-audit --locked --version 0.23.0
          cargo audit
