name: Firmware

# The caption panel's firmware, `firmware/relay-display/`. Two things, in the order a break would
# show up:
#
#   1. The native checks and the release, dev and emulator builds, in Espressif's own container. The
#      builds fetch LVGL from the component registry, and `build.sh` runs the native checks and the
#      image check (no installation's values in the released image) before and after.
#   2. The emulator suite, `firmware/relay-display/tests`, which boots the emulator build under
#      `qemu-system-xtensa` and reads its console and its framebuffer.
#
# Runs only when the firmware, its tests or this file change. The Python app's own tests are in
# release.yml and do not depend on any of this.

on:
  push:
    branches: [main]
    paths:
      - firmware/relay-display/**
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - firmware/relay-display/**
      - .github/workflows/firmware.yml

permissions:
  contents: read

jobs:
  build:
    name: Build and emulate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v5.4.4@sha256:9ce51d4ace496845678065dc86f8e55fb9c25fc9f01f45597042afa7ed546926
    steps:
      - uses: actions/checkout@v7

      # `build.sh` builds into the checkout when given no directory, and git in a container objects
      # to a checkout it does not own.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Release build, with the native checks and the image check
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          firmware/relay-display/build.sh

      - name: Bench build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          firmware/relay-display/build.sh --dev

      - name: Emulator build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          firmware/relay-display/build.sh --qemu

      # The container's own emulator is the build of 2025-08-17. The one pinned here is the one the VXP
      # firmware's suite runs against, which survives the SHA accelerator on a signed image.
      - name: A QEMU that survives the SHA accelerator
        shell: bash
        env:
          QEMU_RELEASE: esp-develop-9.2.2-20260417
          QEMU_ASSET: qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
          QEMU_SHA256: 0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35
        run: |
          set -euo pipefail
          curl -fsSL -o qemu.tar.xz \
            "https://github.com/espressif/qemu/releases/download/$QEMU_RELEASE/$QEMU_ASSET"
          echo "$QEMU_SHA256  qemu.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/qemu"
          tar -xf qemu.tar.xz -C "$RUNNER_TEMP/qemu"
          binary="$(find "$RUNNER_TEMP/qemu" -type f -name qemu-system-xtensa | head -1)"
          "$binary" --version
          echo "RELAY_QEMU=$binary" >> "$GITHUB_ENV"

      - name: Emulator suite
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          pip install pytest
          python -m pytest firmware/relay-display/tests --firmware -v --durations=5 --tb=short
