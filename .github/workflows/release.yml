name: Release

# Push a version tag and this publishes the GitHub release:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Assets:
#   Relay-v1.2.0.zip        the app; unzips to a folder already named Relay/,
#                           so the guide's install steps apply unchanged
#   Relay-User-Guide.pdf    the README's releases/latest/download links
#   Relay-User-Guide.docx   resolve to these
#   relay-display-app.bin   the caption panel's application image, signed with the release key: what an
#                           operator uploads in the admin page's Panels section (#74)
#   relay-display.bin       the same, merged with the bootloader and partition table, for the first flash
#                           of a panel over USB (firmware/relay-display/README.md)
#
# A tag with a hyphen (v1.2.0-rc.1) is published as a pre-release, which
# releases/latest skips. Pull requests that touch this file or the guide run
# every step except the publish, so a broken build shows up before a tag does.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - docs/guide/**

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the base image in docker/Dockerfile.
          python-version: '3.15'
          cache: pip
      # sounddevice needs the PortAudio library to import, even with no
      # audio devices present; the smoke test fakes the devices it needs.
      # The runner's PortAudio is built with PulseAudio and fails to
      # initialise -- so the import fails -- when no Pulse server answers.
      # A headless one with a null sink is enough.
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 pulseaudio
      - run: pulseaudio -D --exit-idle-time=-1 --load=module-null-sink && pactl info | head -3
      # httpx2 is test-only (starlette's TestClient), so it stays out of
      # requirements.txt and the image.
      - run: pip install -r requirements.txt httpx2==2.13.1
      - run: python tests/test_redact.py
      - run: python tests/test_schedules.py
      - run: python tests/test_announce.py
      - run: python tests/test_panels.py
      - run: python tests/test_planningcenter.py
      - run: python tests/test_pclive.py
      - run: python tests/test_servicefeed.py
      - run: python tests/test_pccontrol.py
      - run: python tests/smoke_test.py

  guide:
    name: User guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The versions the committed guide was last built with.
      PANDOC_VERSION: '3.11'
      TYPST_VERSION: '0.15.1'
    steps:
      - uses: actions/checkout@v7
      - name: Install pandoc, typst and fonts
        run: |
          curl -fsSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get update
          sudo apt-get install -y ./pandoc.deb fonts-liberation fonts-dejavu-core
          rm pandoc.deb
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 typst-x86_64-unknown-linux-musl/typst
          pandoc --version | head -1
          typst --version
      - name: Build PDF and DOCX
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export GUIDE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          docs/guide/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: guide
          path: |
            docs/guide/out/Relay-User-Guide.pdf
            docs/guide/out/Relay-User-Guide.docx
          if-no-files-found: error

  panel-firmware:
    name: Panel firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The same container `firmware.yml` builds in, so a release is built the way every push was checked.
    container: espressif/idf:v5.4.4@sha256:9ce51d4ace496845678065dc86f8e55fb9c25fc9f01f45597042afa7ed546926
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # **A tag signs; a pull request only proves the build.** The release key is the trust anchor the panels
      # in the field hold the public half of, and an unsigned image is one no panel will install (it is
      # refused on the panel and by Relay's upload). So a tag without the key fails here, loudly, and a pull
      # request builds unsigned and never sees the secret. The key is written to the runner for the one
      # command and removed after it; it is never in the repository and never in an artifact.
      - name: Build and sign
        shell: bash
        env:
          PANEL_SIGNING_KEY: ${{ secrets.PANEL_FIRMWARE_SIGNING_KEY }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          . "$IDF_PATH/export.sh"
          if [[ "$IS_TAG" == true ]]; then
            if [[ -z "$PANEL_SIGNING_KEY" ]]; then
              echo "::error::PANEL_FIRMWARE_SIGNING_KEY is not set. A release without it would ship panel firmware no panel will install." >&2
              exit 1
            fi
            umask 077
            key="$RUNNER_TEMP/panel_signing_key.pem"
            printf '%s\n' "$PANEL_SIGNING_KEY" > "$key"
            trap 'rm -f "$key"' EXIT
            firmware/relay-display/build.sh --sign "$key"
          else
            firmware/relay-display/build.sh
          fi
      - name: Stage the images
        shell: bash
        run: |
          mkdir -p panel
          cp firmware/relay-display/build/relay-display-app.bin firmware/relay-display/build/relay-display.bin panel/
      - uses: actions/upload-artifact@v7
        with:
          name: panel-firmware
          path: panel/*.bin
          if-no-files-found: error

  release:
    name: Publish release
    needs: [test, guide, panel-firmware]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: guide
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: panel-firmware
          path: dist
      - name: Package the app
        # git archive ships exactly what is committed at the tag: no
        # config.json, docker-config/ or recordings/, which are gitignored.
        run: git archive --format=zip --prefix=Relay/ -o "dist/Relay-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Relay ${GITHUB_REF_NAME}" --generate-notes "${flags[@]}"
