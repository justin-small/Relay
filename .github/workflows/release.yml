name: Release

# Push a version tag and this publishes the GitHub release:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The tag is the one place a version is written: tools/release_tools.py puts it in the Tauri app's
# version, which the shell hands to the backend as RELAY_VERSION (and Relay announces in its mDNS `v` record).
#
# Assets:
#   Relay_1.2.0_x64-setup.exe        Windows installer (NSIS, per user)
#   Relay_1.2.0_aarch64.dmg          macOS, Apple silicon
#   Relay_1.2.0_x64.dmg              macOS, Intel
#   Relay_1.2.0_amd64.AppImage/.deb  Linux
#   *.sig, *.app.tar.gz, latest.json what the in-app updater reads (desktop/src-tauri/src/updater.rs): each
#                                    update artifact is signed with the updater key in the repository secret
#                                    TAURI_SIGNING_PRIVATE_KEY (not an OS code-signing key); the matching public
#                                    key is in desktop/src-tauri/tauri.conf.json
#   Relay-v1.2.0.zip                 the source tree, unzips to Relay/: for a headless Linux service install
#   Relay-User-Guide.pdf/.docx       the README's releases/latest/download links resolve to these
#   relay-display-app.bin            the caption panel's application image, signed with the release key: what an
#                                    operator uploads in the admin page's Panels section (#74)
#   relay-display.bin                the same, merged with the bootloader and partition table, for the first
#                                    flash of a panel over USB (firmware/relay-display/README.md)
#   Relay-Helper-windows-x64.exe, Relay-Helper-macos-arm64.pkg, Relay-Helper-macos-x64.pkg
#                                    the Relay Helper for the show computer (#636). The names do not end in
#                                    -setup.exe or .app.tar.gz, so the updater's latest.json never lists them;
#                                    the admin page's Helpers page links to them on the latest release.
#
# A tag with a hyphen (v1.2.0-rc.1) is published as a pre-release, which releases/latest skips: installs
# update from releases/latest/download/latest.json, so they are never offered one.
# Pull requests that touch this file or desktop/ run every step except the publish (and the updater signing,
# which needs the secret), so a broken build shows up before a tag does. The Intel Mac installer waits for a tag
# to keep pull requests quick: macos-15-intel is the slowest runner (7 to 15 minutes) and the Apple silicon
# build already proves the Mac build. A guide-only change runs guide.yml alone.
# Push a pre-release tag (v1.2.0-rc.1) first to build all four before the real one.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - desktop/**
      - spike/**
      - tools/release_tools.py
      - requirements.txt
      - requirements-wheel.*
      - native/**

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The Python the app is developed and tested on.
          python-version: '3.15'
          cache: pip
      # sounddevice needs the PortAudio library to import, even with no
      # audio devices present; the smoke test fakes the devices it needs.
      # The runner's PortAudio is built with PulseAudio and fails to
      # initialise -- so the import fails -- when no Pulse server answers.
      # A headless one with a null sink is enough.
      # A mirror outage makes apt retry every package until the job's limit; fail fast instead.
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 pulseaudio libasound2-dev
        timeout-minutes: 3
      - run: pulseaudio -D --exit-idle-time=-1 --load=module-null-sink && pactl info | head -3
      # httpx2 is test-only (starlette's TestClient), so it stays out of
      # requirements.txt and the release build.
      - run: pip install -r requirements.txt httpx2==2.13.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            native/relay-bus
            native/relay-ndi
      # The audio bus core is a Rust extension the app imports (#601); build and install it.
      - name: Build the audio bus core
        run: python tools/build_bus_wheel.py
      - run: python tests/test_redact.py
      - run: python tests/test_schedules.py
      - run: python tests/test_announce.py
      - run: python tests/test_panels.py
      - run: python tests/test_planningcenter.py
      - run: python tests/test_pclive.py
      - run: python tests/test_servicefeed.py
      - run: python tests/test_pccontrol.py
      - run: python tests/test_alerts.py
      - run: python tests/test_propresenter.py
      - run: python tests/test_slidetags.py
      - run: python tests/test_pclink.py
      - run: python tests/test_pclobby.py
      - run: python tests/test_overlays.py
      - run: python tests/test_modules.py
      - run: python tests/smoke_test.py

  # The guide build lives in guide.yml, which also runs on its own for pull requests that change the guide.
  guide:
    name: User guide
    uses: ./.github/workflows/guide.yml

  panel-firmware:
    name: Panel firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The same container `firmware.yml` builds in, so a release is built the way every push was checked.
    container: espressif/idf:v5.4.4@sha256:9ce51d4ace496845678065dc86f8e55fb9c25fc9f01f45597042afa7ed546926
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # **A tag signs; a pull request only proves the build.** The release key is the trust anchor the panels
      # in the field hold the public half of, and an unsigned image is one no panel will install (it is
      # refused on the panel and by Relay's upload). So a tag without the key fails here, loudly, and a pull
      # request builds unsigned and never sees the secret. The key is written to the runner for the one
      # command and removed after it; it is never in the repository and never in an artifact.
      - name: Build and sign
        shell: bash
        env:
          PANEL_SIGNING_KEY: ${{ secrets.PANEL_FIRMWARE_SIGNING_KEY }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          . "$IDF_PATH/export.sh"
          if [[ "$IS_TAG" == true ]]; then
            if [[ -z "$PANEL_SIGNING_KEY" ]]; then
              echo "::error::PANEL_FIRMWARE_SIGNING_KEY is not set. A release without it would ship panel firmware no panel will install." >&2
              exit 1
            fi
            umask 077
            key="$RUNNER_TEMP/panel_signing_key.pem"
            printf '%s\n' "$PANEL_SIGNING_KEY" > "$key"
            trap 'rm -f "$key"' EXIT
            firmware/relay-display/build.sh --sign "$key"
          else
            firmware/relay-display/build.sh
          fi
      - name: Stage the images
        shell: bash
        run: |
          mkdir -p panel
          cp firmware/relay-display/build/relay-display-app.bin firmware/relay-display/build/relay-display.bin panel/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-firmware
          path: panel/*.bin
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows on ARM and Linux arm64 come later (#184).
        # Linux is on 24.04, not 22.04: orjson publishes no Python 3.15 wheel for 22.04's glibc (the freeze
        # spike, #179, ran on 24.04).
        # The Intel Mac (the second argument) is built on a tag only; see the top of this file.
        include: >-
          ${{ fromJSON(format('[{0}{1}]',
            '{"name": "windows-x64", "os": "windows-latest", "bundles": "nsis"},
             {"name": "macos-arm64", "os": "macos-latest", "bundles": "app,dmg", "arch": "aarch64"},
             {"name": "linux-x64", "os": "ubuntu-24.04", "bundles": "appimage,deb"}',
            github.ref_type == 'tag' && ',
             {"name": "macos-x64", "os": "macos-15-intel", "bundles": "app,dmg", "arch": "x64"}' || '')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # **A tag signs the updates; a pull request only proves the build.** Without the key an installed
      # copy could never accept the release, so a tag without it fails here, loudly, as the panel
      # firmware's does. The key never reaches a pull request.
      - name: Require the updater signing key
        if: github.ref_type == 'tag'
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. A release without it would ship installers no installed Relay can update to." >&2
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            patchelf libportaudio2 pulseaudio libasound2-dev
          pulseaudio -D --exit-idle-time=-1 --load=module-null-sink
      - name: Version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: python tools/release_tools.py version "$GITHUB_REF_NAME"
      # The audio bus core (native/relay-bus, #601): a Rust extension built here, on the runner it will ship from, so
      # each installer carries its own platform's wheel. maturin is pinned and hash-checked (requirements-wheel.txt),
      # like everything else the build installs. The frozen backend collects it (spike/relay.spec).
      - name: Build the audio bus core
        shell: bash
        run: python tools/build_bus_wheel.py
      - name: Freeze the backend
        shell: bash
        run: |
          python -m pip install -U pip
          # Every package, PyInstaller included, is pinned and hash-checked (requirements-release.txt).
          pip install --require-hashes --only-binary=:all: -r requirements-release.txt
          pyinstaller spike/relay.spec --noconfirm --distpath "$RUNNER_TEMP/relay-dist" --workpath "$RUNNER_TEMP/relay-work"
          exe="$RUNNER_TEMP/relay-dist/relay/relay"
          [[ "$RUNNER_OS" == Windows ]] && exe="$exe.exe"
          RELAY_HOME="$RUNNER_TEMP/probe" "$exe" --probe
          # Lockout recovery is bundled: with no username it prints its usage and exits 2, before opening anything.
          rc=0; RELAY_HOME="$RUNNER_TEMP/probe" "$exe" --reset-owner </dev/null || rc=$?
          [[ $rc == 2 ]] || { echo "::error::relay --reset-owner is missing from the frozen backend (exit $rc)"; exit 1; }
          mkdir -p desktop/src-tauri/relay-backend
          cp -R "$RUNNER_TEMP/relay-dist/relay/." desktop/src-tauri/relay-backend/
      - name: Add cloudflared for Remote access
        # Pinned and checksum-checked (tools/fetch_cloudflared.py); it ships beside the backend, where the
        # remote_access module looks for it. Relay downloads nothing at run time.
        shell: bash
        run: python tools/fetch_cloudflared.py --dest desktop/src-tauri/relay-backend
      - name: Build the installers
        shell: bash
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          extra=()
          [[ "$GITHUB_REF_TYPE" == tag ]] && extra+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          npx tauri build --bundles "${{ matrix.bundles }}" "${extra[@]}"
      - name: Stage the installers
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          bundle=desktop/src-tauri/target/release/bundle
          ver=$(python -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          mkdir -p staged
          shopt -s nullglob
          case "$RUNNER_OS" in
            Windows) files=("$bundle"/nsis/*-setup.exe "$bundle"/nsis/*-setup.exe.sig) ;;
            macOS)
              # Both Macs build a file called Relay.app.tar.gz: name it for its architecture before they meet.
              cp "$bundle/macos/Relay.app.tar.gz" "staged/Relay_${ver}_${ARCH}.app.tar.gz" 2>/dev/null || true
              [[ -f "$bundle/macos/Relay.app.tar.gz.sig" ]] && cp "$bundle/macos/Relay.app.tar.gz.sig" "staged/Relay_${ver}_${ARCH}.app.tar.gz.sig"
              files=("$bundle"/dmg/*.dmg) ;;
            Linux) files=("$bundle"/appimage/*.AppImage "$bundle"/appimage/*.AppImage.sig "$bundle"/deb/*.deb) ;;
          esac
          cp "${files[@]}" staged/
          ls -l staged
          # An installer and (on a tag) a signature for every update artifact, or this job fails.
          compgen -G 'staged/*.exe' >/dev/null || compgen -G 'staged/*.dmg' >/dev/null || compgen -G 'staged/*.AppImage' >/dev/null || { echo "::error::no installer was built"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            for f in staged/*; do
              case "$f" in
                *.sig|*.dmg|*.deb) ;;
                *) [[ -f "$f.sig" ]] || { echo "::error::$f has no .sig"; exit 1; } ;;
              esac
            done
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: staged/*
          if-no-files-found: error

  # The Relay Helper (native/relay-helper, #497, #636): the small program an operator installs on the show computer that
  # runs ProPresenter. A macOS package (Apple silicon and Intel, both built on the Apple silicon runner: the helper is
  # pure Rust, so one runner is enough and a pull request proves both) and a Windows installer. Both register the
  # helper to start at login (`relay-helper install`). Unsigned until a signing certificate exists, like the desktop
  # installers (.github/release-notes.md says how to get past the warning).
  helper:
    name: Relay Helper (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc}
          - {name: macos, os: macos-latest, target: aarch64-apple-darwin}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/relay-helper
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=$(python tools/release_tools.py version "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        shell: bash
        working-directory: native/relay-helper
        env:
          RELAY_HELPER_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            cargo build --release --locked --target aarch64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Package for macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          mkdir -p staged
          for pair in "aarch64-apple-darwin:arm64" "x86_64-apple-darwin:x64"; do
            target=${pair%%:*}; arch=${pair##*:}
            root="$RUNNER_TEMP/pkg-$arch"
            mkdir -p "$root/usr/local/bin"
            cp "native/relay-helper/target/$target/release/relay-helper" "$root/usr/local/bin/relay-helper"
            codesign --force --sign - "$root/usr/local/bin/relay-helper"
            pkgbuild --root "$root" --identifier org.relay.helper --version "${VERSION%%-*}" \
              --scripts native/relay-helper/packaging/macos --install-location / \
              "staged/Relay-Helper-macos-${arch}.pkg"
          done
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          mkdir -p staged
          # NSIS is not on every runner image: install it, pinned.
          choco install nsis --version 3.11 -y --no-progress
          "/c/Program Files (x86)/NSIS/makensis.exe" -V2 "-DVERSION=$VERSION" \
            "-DEXE=$(cygpath -w "$PWD/native/relay-helper/target/${{ matrix.target }}/release/relay-helper.exe")" \
            "-DOUT=$(cygpath -w "$PWD/staged/Relay-Helper-windows-x64.exe")" \
            native/relay-helper/packaging/windows/relay-helper.nsi
      - run: ls -l staged
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-${{ matrix.name }}
          path: staged/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [test, guide, panel-firmware, desktop, helper]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panel-firmware
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: helper-*
          path: dist
          merge-multiple: true
      - name: Package the source
        # git archive ships exactly what is committed at the tag: no
        # config.json or recordings/, which are gitignored. It is what a headless Linux service runs from.
        run: git archive --format=zip --prefix=Relay/ -o "dist/Relay-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"
      - name: Write latest.json for the in-app updater
        run: python3 tools/release_tools.py latest-json dist --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Relay ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md --generate-notes "${flags[@]}"
