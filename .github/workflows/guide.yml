name: User guide

# Builds docs/guide into the PDF and DOCX that a release attaches. Two callers:
#   - a pull request that touches the guide runs this alone, so a guide change waits about a minute instead of
#     for every desktop installer (release.yml no longer runs on guide-only changes);
#   - release.yml calls it on a tag, and its Publish job downloads the `guide` artifact uploaded here.

on:
  pull_request:
    paths:
      - docs/guide/**
      - .github/workflows/guide.yml
  workflow_call:

permissions:
  contents: read

jobs:
  guide:
    name: User guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The versions the committed guide was last built with.
      PANDOC_VERSION: '3.11'
      TYPST_VERSION: '0.15.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pandoc, typst and fonts
        timeout-minutes: 5
        run: |
          curl -fsSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get update
          sudo apt-get install -y ./pandoc.deb fonts-liberation fonts-dejavu-core
          rm pandoc.deb
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 typst-x86_64-unknown-linux-musl/typst
          pandoc --version | head -1
          typst --version
      - name: Build PDF and DOCX
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export GUIDE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          docs/guide/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide
          path: |
            docs/guide/out/Relay-User-Guide.pdf
            docs/guide/out/Relay-User-Guide.docx
          if-no-files-found: error
