name: Spike freeze (#179)
# Throwaway: does the backend freeze with PyInstaller on each OS and Python version?
on:
  push:
    branches: [spike/freeze-179]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    name: ${{ matrix.os }} py${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        py: ['3.15', '3.14', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}
          allow-prereleases: true
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: "Wheels only (does every pin have a binary wheel here?)"
        shell: bash
        run: |
          python -m pip install -U pip
          # uvloop has no Windows build; drop it there to see whether uvicorn falls back.
          if [ "$RUNNER_OS" = Windows ]; then grep -vi '^uvloop' requirements.txt > req.txt; else cp requirements.txt req.txt; fi
          pip install --only-binary=:all: -r req.txt pyinstaller
      - name: Build one-folder
        run: pyinstaller spike/relay.spec --noconfirm --distpath dist-dir --workpath work
      - name: Build one-file
        shell: bash
        run: RELAY_ONEFILE=1 pyinstaller spike/relay.spec --noconfirm --distpath dist-one --workpath work1
      - name: Probe
        shell: bash
        run: |
          export RELAY_CONFIG="$RUNNER_TEMP/probe/config.json"
          EXE=dist-dir/relay/relay; [ "$RUNNER_OS" = Windows ] && EXE=dist-dir/relay/relay.exe
          "$EXE" --probe
      - name: Smoke, size, start-up
        shell: bash
        run: |
          D=dist-dir/relay/relay; O=dist-one/relay
          if [ "$RUNNER_OS" = Windows ]; then D=$D.exe; O=$O.exe; fi
          python spike/smoke.py "$D" dist-dir/relay onedir
          python spike/smoke.py "$O" "$O" onefile
