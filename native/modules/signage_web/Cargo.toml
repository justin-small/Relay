[package]
name = "relay-module-signage_web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Signage: web pages and YouTube (#210, ported in #660): saved links a signage playlist can show, and the checks that a site allows being framed."

[lib]
name = "relay_module_signage_web"
path = "src/lib.rs"

[dependencies]
relay-core = { path = "../../relay-core" }
axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
webpki-roots = "0.26"

[dev-dependencies]
quickcheck = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "test-util"] }
