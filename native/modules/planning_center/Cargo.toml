[package]
name = "relay-module-planning_center"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Planning Center Services (#80, ported in #666): today's plan and its LIVE item on caption panels, panels that move LIVE on, and the rundown on /screen."

[lib]
name = "relay_module_planning_center"
path = "src/lib.rs"

[dependencies]
relay-core = { path = "../../relay-core" }
axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
url = "2"
webpki-roots = "0.26"

[dev-dependencies]
quickcheck = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
