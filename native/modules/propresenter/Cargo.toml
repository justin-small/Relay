[package]
name = "relay-module-propresenter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "ProPresenter (#138, ported in #667): follows the slides, lyrics and timers on panels and screens, control, the slide view and lobby rotation, slide-note tags, and the link to Planning Center."

[lib]
name = "relay_module_propresenter"
path = "src/lib.rs"

[dependencies]
relay-core = { path = "../../relay-core" }
axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "io-util"] }
tracing = "0.1"

[dev-dependencies]
quickcheck = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
