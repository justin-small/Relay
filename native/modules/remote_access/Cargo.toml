[package]
name = "relay-module-remote_access"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Remote access (#50, ported in #662): enrolling with Relay's cloud, checking in, and running cloudflared so viewers off the venue's network can open the viewer links."

[lib]
name = "relay_module_remote_access"
path = "src/lib.rs"

[dependencies]
relay-core = { path = "../../relay-core" }
axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
webpki-roots = "0.26"

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "process", "net"] }
