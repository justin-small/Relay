[package]
name = "relay-module-dante"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Dante (#257, ported in #674): finds the Dante devices on the network, lists their transmit channels, checks the control port, watches levels and clocks, and changes receive subscriptions with confirmation, undo and saved presets."

[lib]
name = "relay_module_dante"
path = "src/lib.rs"

[dependencies]
relay-core = { path = "../../relay-core" }
axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
http-body-util = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1"

[dev-dependencies]
quickcheck = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
