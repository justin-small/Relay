[workspace]
resolver = "2"
members = ["crates/relay-bus", "crates/relay-bus-cpal", "crates/relay-bus-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# The tests run an hour of audio in a few seconds of wall time, which needs optimised code. Debug assertions and
# overflow checks stay on, so the tests still catch arithmetic mistakes.
[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3
