[package]
name = "relay-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Relay's Rust server (#652): the program that will replace the FastAPI app. It opens the viewer, panel and module ports (#653), serves the routes it has and forwards the rest to the running FastAPI."

[lib]
name = "relay_server"
path = "src/lib.rs"

[[bin]]
name = "relay-server"
path = "src/main.rs"

[dependencies]
relay-audio = { path = "../relay-audio" }
relay-captions = { path = "../relay-captions" }
relay-auth = { path = "../relay-auth" }
relay-config = { path = "../relay-config" }
relay-core = { path = "../relay-core" }
relay-module-remote_access = { path = "../modules/remote_access" }
relay-module-ndi = { path = "../modules/ndi" }
relay-module-signage = { path = "../modules/signage" }
relay-module-signage_web = { path = "../modules/signage_web" }
relay-module-planning_center = { path = "../modules/planning_center" }
relay-module-propresenter = { path = "../modules/propresenter" }
relay-show = { path = "../relay-show" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
futures-core = "0.3"
bytes = "1"
http-body-util = "0.1"
gethostname = "0.5"
time = { version = "0.3", features = ["formatting"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server-auto", "tokio", "service"] }
mdns-sd = "0.13"
minijinja = { version = "2", features = ["loader", "preserve_order", "json", "builtins"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
netdev = "0.31"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
x509-parser = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.30"
rand = "0.8"
relay-auth = { path = "../relay-auth" }
quickcheck = "1"
proptest = "1"
