[package]
name = "relay-ndi-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Python binding for Relay's NDI engine (issue 606), built with maturin"

[lib]
# The Python package is `relay_ndi` (python/relay_ndi/__init__.py); this is its native part, `relay_ndi._native`.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
relay-ndi = { path = "../relay-ndi" }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"

[features]
# maturin turns this on for wheels; `cargo test` and clippy leave it off.
extension-module = ["pyo3/extension-module"]
