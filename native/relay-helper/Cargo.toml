[package]
name = "relay-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Relay Helper: a small program on a show computer that Relay controls over one outbound connection (#497)."

[lib]
name = "relay_helper"
path = "src/lib.rs"

[[bin]]
name = "relay-helper"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "fs", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.11"
ureq = { version = "3.5.2", default-features = false }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
