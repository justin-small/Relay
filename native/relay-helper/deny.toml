# cargo-deny policy for the Relay Helper. Run from this folder: `cargo deny check` (or `python tests/run_security.py`).
# Same rules as desktop/src-tauri/deny.toml; the licence list differs only where this workspace needs it.

[graph]
# Only the platforms Relay ships.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
# Vulnerabilities and unsound crates always fail. "Unmaintained" is checked only for crates Relay depends on
# directly: Tauri's Linux stack (zbus_names, zvariant, glib, proc-macro-error) is not ours to replace.
unmaintained = "workspace"

[licenses]
# Permissive licences only. A crate offering "MIT OR Apache-2.0 OR LGPL-2.1-or-later" (r-efi) passes by the
# MIT option. Add a licence here only after checking it can ship in a closed or open installer.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "IJG",   # jpeg-encoder: BSD-like, ships if the documentation credits the Independent JPEG Group (THIRD-PARTY-NOTICES.md)
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# relay-desktop itself is `publish = false` and has no licence field.
ignore = true

[bans]
# Many duplicates come from Tauri's own tree; shown as warnings, not failures.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates only from crates.io: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
