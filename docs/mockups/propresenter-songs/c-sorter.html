<!doctype html><html lang="en" data-theme="dark" data-preset="relay"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../../app/static/tokens.css"><link rel="stylesheet" href="../../../app/static/components.css"><link rel="stylesheet" href="common.css">
<title>ProPresenter songs C · Slide sorter</title>
<style>
.main{display:grid;grid-template-columns:1fr 320px;gap:var(--sp-4);align-items:start}
.grp{margin-bottom:var(--sp-4)}
.grp>.gh{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:var(--sp-3)}
.tile{border:2px solid transparent;border-radius:var(--r-ctl);padding:2px;cursor:pointer}
.tile.sel{border-color:var(--primary)}
.tile .m{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);padding:2px 2px 0}
.insp{position:sticky;top:var(--sp-3)}
.ar{display:flex;gap:var(--sp-1);overflow-x:auto;padding:var(--sp-1) 0}
.pc{flex:0 0 auto;padding:2px var(--sp-3);border-radius:var(--r-pill);border:1px solid var(--border);font-size:var(--fs-sm);display:flex;gap:var(--sp-1);align-items:center;cursor:grab;background:var(--inset)}
.dock{position:sticky;bottom:0;background:var(--card);border:1px solid var(--primary);border-radius:var(--r);padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2)}
@media (max-width:900px){.main{grid-template-columns:1fr}.insp{position:static}}
</style></head><body>
<script src="common.js"></script><script>document.write(nav("c-sorter.html"))</script>
<div class="top"><b>ProPresenter · Songs</b><span class="muted">Goodness of God · G · CCLI 7117038</span><span class="sp"></span><button class="sm">Paste…</button><button class="sm">PDF…</button><button class="sm">Open .pro…</button><span id="hp"></span><button class="sm quiet" id="tog">Preview: no helper</button></div>
<div class="wrap stack">
<div class="gap"><div class="seg" style="width:auto"><button class="on">Slides</button><button>Text</button></div><label class="check" style="margin:0"><input type="checkbox" id="trl" checked> Translation line</label><label class="check" style="margin:0"><input type="checkbox" checked> Chords in text</label><span class="grow"></span><label style="margin:0">Lines per slide</label><select class="sm" style="width:auto" id="lps"><option>2</option><option selected>4</option><option>6</option></select><button class="sm" id="split">Auto-split…</button><select class="sm" style="width:auto"><option>Template: Sunday defaults</option></select></div>
<div class="main">
<div id="g"></div>
<div class="insp card stack"><h3 style="margin:0">Slide <span id="isn">1</span></h3><div id="isp"></div>
<div class="field" style="margin:0"><label>Lyric</label><textarea id="itx" style="min-height:90px"></textarea></div>
<div class="field" style="margin:0"><label>Translation line (optional)</label><textarea id="itr" style="min-height:70px"></textarea></div>
<div class="cols" style="grid-template-columns:1fr 1fr;gap:var(--sp-2)"><div class="field" style="margin:0"><label>Label</label><select><option>Verse</option><option>Chorus</option></select></div><div class="field" style="margin:0"><label>Hot key</label><input value="1"></div><div class="field" style="margin:0"><label>Auto-advance (s)</label><input placeholder="off"></div><div class="field" style="margin:0"><label>Action</label><select><option>None</option><option>Run look…</option></select></div></div>
<div class="field" style="margin:0"><label>Notes</label><input placeholder="For the operator"></div>
<div class="gap"><button class="sm">Split here</button><button class="sm">Merge with next</button><button class="sm danger">Delete</button></div></div>
</div>
<div id="nh"></div>
<div class="dock"><div class="between"><b>Arrangement</b><div class="tabs" id="arr" style="margin:0"></div><button class="sm quiet">New</button></div>
<div class="ar" id="ord"></div><p class="hint" style="margin:0" id="so"></p>
<div class="between"><span id="val"></span><button class="primary" id="send">Send to ProPresenter</button></div></div>
</div><div id="dlgs"></div>
<script>
const $ = (i) => document.getElementById(i); let helper = true, cur = 0, pick = 0;
function render() {
  const n = +$("lps").value, tr = $("trl").checked; let k = 0;
  $("g").innerHTML = SONG.sections.map(s => `<div class="grp"><div class="gh"><i class="sw c-${s.kind}"></i><b>${s.name}</b><span class="tag">${slidesOf(s, n).length} slides</span><span class="grow"></span><button class="sm quiet">Rename</button><button class="sm quiet">Duplicate</button></div>
    <div class="grid">${slidesOf(s, n).map(x => { const i = k++; return `<div class="tile${i === pick ? " sel" : ""}" data-i="${i}">${slideHTML(x, { tr, maxLines: n })}<div class="m"><span>${i + 1}</span><span>${i === 0 ? "hot key 1" : ""}</span></div></div>`; }).join("")}<button style="aspect-ratio:16/9;border-style:dashed;color:var(--muted)">+ Slide</button></div></div>`).join("");
  const all = SONG.sections.flatMap(s => slidesOf(s, n)), x = all[pick] || all[0];
  $("isn").textContent = pick + 1; $("itx").value = x.lines.join("\n"); $("itr").value = x.tr.join("\n"); $("isp").innerHTML = slideHTML(x, { tr, maxLines: n });
  const S = (id) => SONG.sections.find(s => s.id === id), o = SONG.arrangements[cur].order;
  $("arr").innerHTML = SONG.arrangements.map((a, i) => `<button class="${i === cur ? "on" : ""}" data-a="${i}">${a.name}</button>`).join("");
  $("ord").innerHTML = o.map(id => `<span class="pc" draggable="true"><i class="sw c-${S(id).kind}" style="margin:0"></i>${S(id).name}<span class="muted">×</span></span>`).join("");
  $("so").textContent = o.reduce((a, id) => a + slidesOf(S(id), n).length, 0) + " slides in this order. Drag chips to reorder; a section may repeat.";
  $("val").innerHTML = `<span class="ok">Ready to send</span>`; $("hp").innerHTML = helperPill(helper); $("nh").innerHTML = helper ? "" : noHelperNote(); $("send").disabled = !helper;
}
document.addEventListener("click", e => { const t = e.target.closest(".tile"); if (t) { pick = +t.dataset.i; render(); } const a = e.target.closest("[data-a]"); if (a) { cur = +a.dataset.a; render(); } });
["trl", "lps"].forEach(i => $(i).addEventListener("input", render));
$("tog").onclick = () => { helper = !helper; $("tog").textContent = helper ? "Preview: no helper" : "Preview: helper on"; render(); };
$("split").onclick = () => { $("dlgs").innerHTML = `<div class="veil"><div class="dlg"><h3>Split into ${$("lps").value} lines per slide?</h3><p class="note" style="margin-top:0">Nothing is saved until you confirm.</p><div class="dl"><span class="muted">Before</span><span>9 slides</span><span class="muted">After</span><span class="add">11 slides (+2)</span></div><div class="gap" style="margin-top:var(--sp-4);justify-content:flex-end"><button id="x">Cancel</button><button class="primary" id="y">Split</button></div></div></div>`; $("x").onclick = $("y").onclick = () => $("dlgs").innerHTML = ""; };
$("send").onclick = () => { $("dlgs").innerHTML = `<div class="veil"><div class="dlg"><h3>Sent</h3><p>ProPresenter on Studio Mac is opening the song.</p><div class="gap" style="justify-content:flex-end"><button class="primary" id="x">Done</button></div></div></div>`; $("x").onclick = () => $("dlgs").innerHTML = ""; };
render();
</script></body></html>
