<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rundown A · Ruler</title>
<link rel="stylesheet" href="common.css">
<style>
/* Option A: the hour drawn to scale. A block is as tall as its minutes, so the 32-minute sermon is half the board and
   the two minutes the service has slipped show as a slant between the plan lane and the real one. */
:root { --ink: #0c0c0d; --f: #ededee; --dim: #8b8b92; --faint: #44444a; --rule: #222226;
  --song: #f0b443; --talk: #d9dce3; --media: #5b5e66; --now: #ff4d3d; --mic: #79b8ff; }
.stage { background: var(--ink); color: var(--f); font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
.lbl { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

/* the ruler */
.ruler { position: absolute; left: 40px; top: 40px; width: 720px; height: 1000px; }
.ruler .tick { position: absolute; left: 0; width: 720px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--faint); }
.ruler .tick span { position: absolute; left: 0; top: 2px; }
.plan { position: absolute; left: 52px; width: 70px; border: 1px solid #3a3a40; border-left-width: 3px; box-sizing: border-box;
  font-size: 13px; color: var(--dim); padding: 2px 6px; overflow: hidden; }
.drift { position: absolute; left: 122px; top: 0; width: 46px; height: 1000px; overflow: visible; }
.blk { position: absolute; left: 168px; width: 552px; box-sizing: border-box; border-left: 6px solid var(--talk);
  background: #17171a; padding: 0 14px; display: flex; align-items: center; gap: 14px; overflow: hidden; }
.blk.song { border-color: var(--song); } .blk.media { border-color: var(--media); }
.blk .at { font-size: 18px; color: var(--dim); width: 48px; flex: none; }
.blk .t { font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .k { font-size: 14px; color: var(--song); border: 1px solid #5c4720; padding: 0 6px; }
.blk .ld { font-size: 15px; color: var(--dim); white-space: nowrap; }
.blk.done { background: transparent; opacity: .4; }
.blk.current { background: #2a1512; }
.blk.tall { align-items: flex-start; padding-top: 12px; flex-wrap: wrap; align-content: flex-start; }
.blk .peek { flex-basis: 100%; font-size: 15px; color: var(--dim); line-height: 1.45; white-space: pre-line; }
.playhead { position: absolute; left: 0; width: 760px; height: 0; border-top: 3px solid var(--now); }
.playhead span { position: absolute; right: -2px; top: -15px; background: var(--now); color: #fff; font-weight: 700;
  font-size: 15px; padding: 3px 8px; }

/* now */
.now { position: absolute; left: 820px; top: 40px; width: 560px; }
.now h1 { font-size: 84px; line-height: 1; margin: 14px 0 12px; letter-spacing: -.02em; }
.now .sub { font-size: 22px; color: var(--dim); }
.now .sub b { color: var(--song); font-weight: 600; border: 1px solid #5c4720; padding: 0 8px; margin-right: 10px; }
.left { font-size: 168px; font-weight: 300; line-height: 1; margin: 34px 0 10px; letter-spacing: -.03em; }
.bar6 { position: relative; height: 14px; background: #232327; }
.bar6 i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--song); }
.bar6 em { position: absolute; top: 20px; font-style: normal; font-size: 14px; color: var(--faint); }
.slip { margin-top: 56px; font-size: 26px; line-height: 1.35; }
.slip .w { color: var(--now); font-weight: 700; }
.slip .d { color: var(--dim); }
.then { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--rule); font-size: 24px; }
.then .u { color: var(--now); }
.onmics { margin-top: 22px; columns: 2; column-gap: 24px; font-size: 19px; }
.onmics div { display: flex; align-items: center; gap: 10px; height: 35px; break-inside: avoid; }
.onmics span { color: var(--mic); width: 28px; }
.face { width: 30px; height: 30px; flex: none; background: #2a2a2e center 25% / cover; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.6); }

/* right: notes and the people without mics */
.side { position: absolute; left: 1440px; top: 40px; width: 440px; height: 1000px; display: flex; flex-direction: column; gap: 26px; }
.notes { flex: 1; min-height: 0; overflow: hidden; }
.notes p { font-size: 18px; line-height: 1.5; margin: 12px 0 0; white-space: pre-line; color: #c9c9ce; }
.crew { flex: none; }
.crew div { display: flex; justify-content: space-between; font-size: 18px; padding: 7px 0; border-top: 1px solid var(--rule); }
.crew .pos { color: var(--dim); }
.crew .bad { color: var(--now); } .crew .pend { color: var(--song); } .crew .off { color: var(--faint); text-decoration: line-through; }

/* micboard: each mic gets its own little ruler of the hour, lit where it is drawn */
.mb-head { position: absolute; left: 40px; top: 32px; right: 40px; height: 120px; display: flex; align-items: flex-end; gap: 40px; }
.mb-head h1 { font-size: 64px; margin: 0; line-height: 1; }
.mb-head .left { font-size: 96px; margin: 0; }
.mb-head .slip { margin: 0 0 6px auto; font-size: 24px; text-align: right; }
.mb-hour { position: absolute; left: 40px; right: 40px; top: 176px; height: 40px; }
.mb-grid { position: absolute; left: 40px; right: 40px; top: 236px; bottom: 40px; display: grid;
  grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(3, 1fr); gap: 14px; }
.m { background: #17171a; border-top: 6px solid var(--song); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.m .ph { position: relative; flex: 1; min-height: 0; background: #26262a center 25% / cover no-repeat; display: grid; place-items: center; }
.m .ph .ini { font-size: 64px; font-weight: 700; color: rgba(255,255,255,.55); }
.m .bd { padding: 10px 14px 12px; }
.m.spoken { border-color: var(--talk); }
.m.empty { border-color: var(--faint); } .m.empty .ph { background: repeating-linear-gradient(135deg, #141416 0 10px, #101012 10px 20px); }
.m .n { position: absolute; left: 0; top: 0; background: var(--ink); padding: 4px 12px 6px 10px; font-size: 38px; font-weight: 700; color: var(--mic); line-height: 1; }
.m .nm { font-size: 24px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .ps { font-size: 15px; color: var(--dim); margin-top: 2px; }
.m.empty .nm { color: var(--now); } .m.spare .nm { color: var(--dim); }
.m .lane { position: relative; height: 8px; margin-top: 12px; background: #232327; }
.m .lane i { position: absolute; top: 0; bottom: 0; background: var(--song); }
.m .lane i.done { opacity: .35; }
.m .lane b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--now); }

/* side: captions and a narrow ruler */
.caps { position: absolute; left: 80px; top: 0; width: 1180px; height: 1080px; display: flex; flex-direction: column;
  justify-content: center; gap: 30px; font-size: 64px; line-height: 1.3; font-weight: 500; }
.caps p { margin: 0; }
.mini { position: absolute; left: 1380px; top: 40px; width: 500px; height: 1000px; }
.mini .blk { left: 70px; width: 430px; }
.mini .tick { width: 500px; }
.mini .playhead { width: 500px; }
.mini .ld { display: none; } .mini .faces { flex-basis: 100%; display: flex; gap: 4px; flex-wrap: wrap; } .mini .faces .face { width: 30px; height: 30px; font-size: 11px; } .mini .blk.current { flex-wrap: wrap; align-content: center; row-gap: 8px; } .mini .blk { width: 410px; } .mini .playhead span { right: 20px; }
</style>
</head>
<body>
<div class="stage"></div>
<script src="common.js"></script>
<script>
const R = RD, e = R.esc;
const face = (name, cls = "face") => { const u = R.photo(name);
  return `<i class="${cls}" style="${u ? `background-image:url('${u}')` : ""}">${u ? "" : R.initials(name)}</i>`; };
const kind = (it) => it.kind === "song" ? "song" : it.kind === "media" ? "media" : "talk";

function ruler(top, h, from, to, opts = {}) {
  const ppm = h / (to - from), y = (m) => (m - from) * ppm;
  let out = "";
  for (let m = Math.ceil(from / 5) * 5; m <= to; m += 5) if (m % 15 === 0) out += `<div class="tick tnum" style="top:${y(m)}px"><span>${R.fmt(m)}</span></div>`;
  if (!opts.mini) {
    let lines = "";
    for (const it of R.items) {
      if (it.p < from) continue;
      out += `<div class="plan tnum" style="top:${y(it.p)}px;height:${it.len * ppm - 2}px">${it.len * ppm > 18 ? R.fmt(it.p) : ""}</div>`;
      if (it.a !== it.p) lines += `<line x1="0" y1="${y(it.p)}" x2="46" y2="${y(it.a)}" stroke="#ff4d3d" stroke-width="1.5" opacity=".7"/>`;
    }
    out += `<svg class="drift" viewBox="0 0 46 ${h}">${lines}</svg>`;
  }
  for (const it of R.items) {
    if (it.a + it.len <= from) continue;
    const top_ = Math.max(y(it.a), 0), hh = (it.a + it.len) * ppm - from * ppm - top_ - 3;
    const tall = hh > 140 && it.notes;
    out += `<div class="blk ${kind(it)}${it.done ? " done" : ""}${it.current ? " current" : ""}${tall ? " tall" : ""}" style="top:${top_}px;height:${hh}px">
      <span class="at tnum">${R.fmt(it.a)}</span><span class="t">${e(it.t)}</span>${it.key ? `<span class="k">${it.key}</span>` : ""}
      ${it.lead && hh > 24 ? `<span class="ld">${e(it.lead)}</span>` : ""}
      ${opts.mini && it.current ? `<div class="faces">${R.mics.filter((m) => m[4] && m[1]).map((m) => face(m[1])).join("")}</div>` : ""}
      ${tall ? `<div class="peek">${e(R.notes.split("\n\n").slice(0, opts.mini ? 2 : 4).join("\n\n"))}</div>` : ""}</div>`;
  }
  const nowM = 13.15;
  out += `<div class="playhead" style="top:${y(nowM)}px"><span class="tnum">${R.now.slice(0, 4)}</span></div>`;
  return `<div class="ruler${opts.mini ? " mini" : ""}" style="top:${top}px;height:${h}px">${out}</div>`;
}

const cur = R.items.find((i) => i.current);
const nowBlock = () => `
  <div class="lbl">Now · ${R.service}</div>
  <h1>${e(R.current.title)}</h1>
  <div class="sub"><b>${R.current.key}</b>${e(R.current.leader)} leads</div>
  <div class="left tnum">${R.current.left}</div>
  <div class="bar6"><i style="width:${cur.elapsed / cur.len * 100}%"></i><em style="left:0">${R.fmt(cur.a)}</em><em style="right:0">${R.fmt(cur.a + cur.len)}</em></div>`;

const slip = () => `<div class="slip"><span class="w">${R.over} minutes behind.</span> <span class="d">The service ends at</span> ${R.projectedEnd} <span class="d">instead of ${R.plannedEnd}.</span></div>`;

const crewRow = (c) => `<div><span class="${c[3] === "unfilled" ? "bad" : c[3] === "pending" ? "pend" : c[3] === "declined" ? "off" : ""}">${c[0] ? e(c[0]) : "No one yet"}${c[3] === "pending" ? " · not confirmed" : ""}</span><span class="pos">${e(c[1])}</span></div>`;

RD.mount({
  full: () => ruler(40, 1000, -5, 73) + `
    <div class="now">${nowBlock()}${slip()}
      <div class="then"><span class="lbl">Then, at ${R.fmt(15)}</span><br>${R.next.title} · <span class="u">no one on mic 12</span></div>
      <div class="lbl" style="margin-top:34px">On mics for this song</div>
      <div class="onmics">${R.mics.filter((m) => m[4] && m[1]).map((m) => `<div>${face(m[1])}<span class="tnum">${m[0]}</span>${e(R.first(m[1]))}</div>`).join("")}</div>
    </div>
    <div class="side">
      <div class="notes"><div class="lbl">Sermon · Rooted · at ${R.fmt(24)}</div><p>${e(R.notes)}</p></div>
      <div class="crew"><div class="lbl" style="border:0;padding-bottom:4px">Serving without a mic</div>${R.crew.map(crewRow).join("")}</div>
    </div>`,
  micboard: () => {
    const span = 78, x = (m) => (m + 5) / span * 100;
    const songs = R.items.filter((i) => i.kind === "song");
    const hour = R.items.map((it) => `<div style="position:absolute;left:${x(it.a)}%;width:calc(${it.len / span * 100}% - 3px);top:0;height:40px;background:${it.done ? "#1b1b1e" : "#232327"};border-top:4px solid ${kind(it) === "song" ? "var(--song)" : kind(it) === "media" ? "var(--media)" : "var(--talk)"};font-size:13px;color:var(--dim);padding:6px 6px 0;box-sizing:border-box;overflow:hidden;white-space:nowrap">${it.len >= 4 ? e(it.t.split(" · ")[0]) : ""}</div>`).join("")
      + `<div style="position:absolute;left:${x(13.15)}%;top:-8px;height:56px;width:3px;background:var(--now)"></div>`;
    const tile = (m) => {
      const empty = !m[1];
      const lane = m[4] ? songs.map((s) => `<i class="${s.done ? "done" : ""}" style="left:${x(s.a)}%;width:${s.len / span * 100}%"></i>`).join("") : "";
      return `<div class="m${m[4] ? "" : " spoken"}${empty ? " empty" : ""}${m[5] === "spare" ? " spare" : ""}">
        <div class="ph" style="${R.photo(m[1]) ? `background-image:url('${R.photo(m[1])}')` : ""}">${m[1] && !R.photo(m[1]) ? `<span class="ini">${R.initials(m[1])}</span>` : ""}<div class="n tnum">${m[0]}</div></div>
        <div class="bd"><div class="nm">${empty ? (m[5] === "spare" ? "Spare" : "No one yet") : e(m[1])}</div>
        <div class="ps">${e(m[2])}${m[5] === "leading" ? " · leading this song" : ""}${!m[4] && !empty ? " · spoken" : ""}</div>
        <div class="lane">${lane}<b style="left:${x(13.15)}%"></b></div></div></div>`;
    };
    return `<div class="mb-head"><div><div class="lbl">Now</div><h1>${e(R.current.title)}</h1></div><div class="left tnum">${R.current.left}</div>${slip()}</div>
      <div class="mb-hour">${hour}</div>
      <div class="mb-grid">${R.mics.map(tile).join("")}</div>`;
  },
  side: () => `<div class="caps">${R.captions.map((c) => `<p>${e(c)}</p>`).join("")}</div>`
    + ruler(40, 1000, 5, 64, { mini: true }),
});
</script>
</body>
</html>
