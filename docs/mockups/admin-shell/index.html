<!doctype html>
<html lang="en" data-theme="dark" data-preset="relay" data-sb="inset" data-collapse="icon" data-layout="centered" data-navbar="sticky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay · Operator (shadcn-style mockup)</title>
<style>
:root{--brand:#4ade80;--rail:48px;--sbw:272px;--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--shadow:none;--hover-fg:var(--fg)}
/* theme presets: same shape as the reference (background, card, border, primary, sidebar, hover/accent, radius) */
[data-theme=dark]{--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--info:#60a5fa;--err-fg:#fff;--faint:#71717a}
[data-theme=light]{--ok:#15803d;--warn:#b45309;--err:#b91c1c;--info:#1d4ed8;--err-fg:#fff;--faint:#71717a}
[data-preset=relay][data-theme=dark]{--bg:#09090b;--fg:#fafafa;--muted:#a1a1aa;--card:#111113;--border:#27272a;--primary:#4ade80;--primary-fg:#052e16;--sb:#0c0c0e;--hover:color-mix(in srgb,#4ade80 14%,transparent);--hover-fg:#4ade80;--r:10px}
[data-preset=relay][data-theme=light]{--bg:#f4f4f5;--fg:#18181b;--muted:#71717a;--card:#fff;--border:#e4e4e7;--primary:#15803d;--primary-fg:#fff;--sb:#fafafa;--hover:color-mix(in srgb,#15803d 12%,transparent);--hover-fg:#15803d;--r:10px}
[data-preset=softpop][data-theme=light]{--bg:oklch(.9789 .0082 121.6);--fg:#000;--muted:oklch(.3211 0 0);--card:#fff;--border:#000;--primary:oklch(.5106 .2301 276.97);--primary-fg:#fff;--sb:oklch(.9789 .0082 121.6);--hover:oklch(.7686 .1647 70.08);--hover-fg:#000;--r:16px;--shadow:2px 2px 0 0 #000}
[data-preset=softpop][data-theme=dark]{--bg:#000;--fg:#fff;--muted:oklch(.8452 0 0);--card:oklch(.2455 .0217 257.28);--border:oklch(.4459 0 0);--primary:oklch(.6801 .1583 276.93);--primary-fg:#000;--sb:#000;--hover:oklch(.879 .1534 91.6);--hover-fg:#000;--r:16px}
[data-preset=tangerine][data-theme=light]{--bg:oklch(.94 0 236.5);--fg:oklch(.32 0 0);--muted:oklch(.55 .02 264.36);--card:#fff;--border:oklch(.9 .01 247.88);--primary:oklch(.64 .17 36.44);--primary-fg:#fff;--sb:oklch(.9 0 258.33);--hover:oklch(.91 .02 243.82);--r:10px;--shadow:0 1px 2px #0002}
[data-preset=tangerine][data-theme=dark]{--bg:oklch(.26 .03 262.67);--fg:oklch(.92 0 0);--muted:oklch(.72 0 0);--card:oklch(.31 .03 268.64);--border:oklch(.38 .03 269.73);--primary:oklch(.64 .17 36.44);--primary-fg:#fff;--sb:oklch(.31 .03 267.74);--hover:oklch(.34 .06 267.59);--r:10px}
[data-preset=brutalist][data-theme=light]{--bg:#fff;--fg:#000;--muted:oklch(.3211 0 0);--card:#fff;--border:#000;--primary:oklch(.6489 .237 26.97);--primary-fg:#fff;--sb:oklch(.9551 0 0);--hover:oklch(.5635 .2408 260.82);--hover-fg:#fff;--r:0px;--shadow:4px 4px 0 0 #000}
[data-preset=brutalist][data-theme=dark]{--bg:#000;--fg:#fff;--muted:oklch(.8452 0 0);--card:oklch(.3211 0 0);--border:#fff;--primary:oklch(.7044 .1872 23.19);--primary-fg:#000;--sb:#000;--hover:oklch(.6755 .1765 252.26);--hover-fg:#000;--r:0px;--shadow:4px 4px 0 0 #fff}
*{box-sizing:border-box}
body{margin:0;background:var(--sb);color:var(--fg);font:14px/1.45 var(--font);height:100vh;overflow:hidden}
button,input,select{font-family:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 50%,transparent)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;height:100vh;background:var(--sb)}
html:not([data-sb=inset]) .app{background:var(--bg)}
/* ---------- sidebar ---------- */
aside{flex:none;width:var(--sbw);overflow:hidden;transition:width .2s linear}
.sbin{width:var(--sbw);height:100%;display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--sb);transition:width .2s linear,transform .2s linear}
html[data-sb=sidebar] aside{border-right:1px solid var(--border)}
html[data-sb=floating] aside{padding:8px}
html[data-sb=floating] .sbin{width:calc(var(--sbw) - 16px);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
html.cl[data-collapse=icon] aside{width:var(--rail)}html.cl[data-collapse=icon] .sbin{width:var(--rail)}
html.cl[data-collapse=icon][data-sb=floating] aside{width:calc(var(--rail) + 16px)}
html.cl[data-collapse=offcanvas] aside{width:0;padding:0;border:0}html.cl[data-collapse=offcanvas] .sbin{transform:translateX(-100%)}
.sbhead{padding:6px 6px 4px;display:flex;align-items:center;height:40px;overflow:hidden}
.lk{display:block;color:var(--fg)}.lk svg{display:block}.mk{display:none;color:var(--fg)}
html.cl[data-collapse=icon] .lk{display:none}html.cl[data-collapse=icon] .mk{display:block}
.sbscroll{flex:1;overflow:auto;overflow-x:hidden;margin:0 -2px;padding:0 2px}
.qc{display:flex;gap:8px;align-items:center;margin:4px 0 8px}
.qc .go{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:0;border-radius:calc(var(--r) - 2px);background:var(--primary);color:var(--primary-fg);font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;transition:background-color .2s linear,opacity .2s}
.qc .go:hover{background:color-mix(in srgb,var(--primary) 90%,var(--fg))}
.qc .go.live{background:var(--hover);color:var(--hover-fg);box-shadow:inset 0 0 0 1px var(--primary)}
.qc .inb{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--border);border-radius:calc(var(--r) - 2px);background:var(--bg);color:var(--fg);cursor:pointer;transition:opacity .2s linear,width .2s linear,margin .2s linear}
html.cl[data-collapse=icon] .qc .inb{opacity:0;width:0;margin-left:-8px;border:0;pointer-events:none}
.grp{height:32px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:500;color:color-mix(in srgb,var(--fg) 70%,transparent);transition:margin .2s linear,opacity .2s linear;white-space:nowrap}
html.cl[data-collapse=icon] .grp{margin-top:-32px;opacity:0;pointer-events:none}
.nav a,.nav .nb{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border:0;background:none;border-radius:calc(var(--r) - 2px);color:var(--fg);text-decoration:none;cursor:pointer;font-size:14px;text-align:left;white-space:nowrap;overflow:hidden;position:relative;transition:background-color .15s,color .15s}
.nav a:hover,.nav .nb:hover,.nav a[aria-current=page],.nav .nb.act{background:var(--hover);color:var(--hover-fg)}
.nav a[aria-current=page]{font-weight:500}
.nav .dis{opacity:.5;pointer-events:none}
.nav .nl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nbadge{font-size:11px;line-height:1;padding:3px 6px;border-radius:calc(var(--r) / 2);border:1px solid;text-transform:capitalize;flex:none}
.nbadge.new{border-color:#05966933;background:#10b9811a;color:#047857}.nbadge.updated{border-color:#2563eb33;background:#3b82f61a;color:#1d4ed8}.nbadge.soon{border-color:#71717a33;background:#71717a1a;color:#52525b}
[data-theme=dark] .nbadge.new{border-color:#34d39940;color:#6ee7b7}[data-theme=dark] .nbadge.updated{border-color:#60a5fa40;color:#93c5fd}[data-theme=dark] .nbadge.soon{border-color:#a1a1aa40;color:#d4d4d8}
.chev{transition:transform .2s;flex:none}.open>.nb .chev{transform:rotate(90deg)}
.subm{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease-out}.open>.subm{grid-template-rows:1fr}
.subm>div{overflow:hidden;min-height:0}
.subm ul{list-style:none;margin:2px 0 2px 14px;padding:0 0 0 10px;border-left:1px solid var(--border)}
.subm a{height:28px;font-size:13px}
html.cl[data-collapse=icon] .nl,html.cl[data-collapse=icon] .nbadge,html.cl[data-collapse=icon] .chev,html.cl[data-collapse=icon] .subm,html.cl[data-collapse=icon] .supp,html.cl[data-collapse=icon] .uinfo{display:none}
html.cl[data-collapse=icon] .qc .go{padding:0;justify-content:center}html.cl[data-collapse=icon] .qc .go .nl{display:none}
html.cl[data-collapse=icon] .nav a,html.cl[data-collapse=icon] .nav .nb{padding:0;justify-content:center}
.supp{border:1px solid var(--border);border-radius:var(--r);background:var(--card);padding:12px 14px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
.supp b{display:block;color:var(--fg);font-size:14px;font-weight:600;margin-bottom:3px}.supp a{color:var(--fg)}.supp a:hover{text-decoration:underline}
.user{display:flex;gap:8px;align-items:center;height:48px;padding:0 8px;border:0;background:none;border-radius:calc(var(--r) - 2px);cursor:pointer;color:var(--fg);text-align:left;width:100%;transition:background-color .15s}
.user:hover,.user[aria-expanded=true]{background:var(--hover);color:var(--hover-fg)}
html.cl[data-collapse=icon] .user{padding:0;justify-content:center}
.av{position:relative;width:32px;height:32px;border-radius:calc(var(--r) - 2px);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--tone,#3f3f46);color:var(--tonefg,#fff)}
.av.gs{filter:grayscale(1)}.av.lg{width:36px;height:36px}
.avb{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--card);color:#fff}.avb svg{width:8px;height:8px;stroke-width:3}
.uinfo{flex:1;min-width:0;line-height:1.25}.uinfo b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uinfo small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user:hover small{color:inherit}
/* ---------- content ---------- */
.inset{flex:1;min-width:0;background:var(--bg);display:flex;flex-direction:column;overflow:auto;position:relative}
html[data-sb=inset] .inset{margin:8px 8px 8px 0;border:1px solid var(--border);border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow)}
html.cl[data-sb=inset] .inset{margin-left:8px}
.top{display:flex;align-items:center;gap:8px;height:48px;flex:none;padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg);border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0}
html[data-navbar=sticky] .top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 50%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ib{width:32px;height:32px;background:none;border:1px solid transparent;color:var(--fg);border-radius:calc(var(--r) - 2px);cursor:pointer;display:grid;place-items:center}.ib:hover,.ib[aria-expanded=true]{background:var(--hover);color:var(--hover-fg)}
.vsep{width:1px;height:16px;background:var(--border);margin:0 8px}
.sp{flex:1}
.search{display:flex;align-items:center;gap:8px;height:32px;border:1px solid var(--border);border-radius:calc(var(--r) - 2px);padding:0 8px 0 10px;color:var(--muted);cursor:pointer;min-width:220px;background:var(--card);font-size:13px}.search:hover{color:var(--fg)}
kbd{margin-left:auto;font:11px ui-monospace,monospace;border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;background:var(--card);white-space:nowrap;color:inherit;text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:ping 2s ease-out infinite}.dot.off{background:#71717a;animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 #4ade8066}100%{box-shadow:0 0 0 8px #4ade8000}}
.crumb{color:var(--muted);white-space:nowrap}.crumb b{color:var(--fg);font-weight:600}
main{flex:1;padding:24px}
.wrap{margin:0 auto;width:100%}html[data-layout=centered] .wrap{max-width:1536px}
h2.t{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.card h3{font-size:14px;margin:0 0 2px}.card .d:not(.btn){color:var(--muted);font-size:12px;margin:0 0 12px}
.stat .k{color:var(--muted);font-size:12px}.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}.stat .s{font-size:12px;color:var(--muted)}
.up{color:var(--ok)}.dn{color:var(--err)}
.btn{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:calc(var(--r) - 2px);padding:6px 13px;font:inherit;font-weight:500;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s,transform .1s}.btn:hover{background:var(--hover);color:var(--hover-fg)}
.btn.p{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}.btn.p:hover{background:color-mix(in srgb,var(--primary) 90%,var(--fg));color:var(--primary-fg)}
.btn.d{background:#7f1d1d;border-color:#7f1d1d;color:#fff}.btn.sm{padding:3px 10px;font-size:12px}
.btn:active,.ib:active{transform:translateY(1px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border)}td{padding:10px;border-bottom:1px solid var(--border)}tr:last-child td{border:0}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600}.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}.badge.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,transparent)}
.tabs{display:inline-flex;background:color-mix(in srgb,var(--fg) 8%,var(--bg));border-radius:calc(var(--r) - 1px);padding:3px;margin-bottom:14px}.tabs button{background:none;border:0;color:var(--muted);padding:5px 13px;border-radius:calc(var(--r) - 3px);font:inherit;cursor:pointer;transition:background-color .15s,color .15s}.tabs button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px #0005}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
input,select,textarea{width:100%;padding:7px 10px;border-radius:calc(var(--r) - 2px);border:1px solid var(--border);background:var(--bg);color:var(--fg);font:inherit}
input[type=range]{accent-color:var(--primary);padding:0}input[type=checkbox]{width:auto;accent-color:var(--primary)}
.sw{width:36px;height:20px;border-radius:99px;background:#52525b;position:relative;cursor:pointer;flex:none;border:0;transition:background-color .15s}.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s ease-out}.sw.on{background:var(--primary)}.sw.on::after{left:18px}
.meter{height:12px;border-radius:6px;background:var(--hover);overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;width:62%;background:var(--primary);transition:width .2s}
.tx p{margin:0 0 8px}.tx .o{color:var(--muted)}.tx small{color:var(--muted);font-size:11px;margin-right:8px}
.chart{display:flex;align-items:flex-end;gap:5px;height:120px}.chart i{flex:1;background:var(--primary);border-radius:4px 4px 0 0;opacity:.85}
.mod{display:flex;gap:12px;align-items:flex-start}.mod .ic{width:36px;height:36px;border-radius:9px;background:var(--hover);color:var(--hover-fg);display:grid;place-items:center;flex:none;font-weight:700}
.wrap>*{animation:in .2s ease-out both}.wrap>*:nth-child(2){animation-delay:.03s}.wrap>*:nth-child(3){animation-delay:.06s}.wrap>*:nth-child(n+4){animation-delay:.09s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--border))}
/* ---------- popups: menu, popover, tooltip, command ---------- */
.pop{position:fixed;z-index:40;min-width:200px;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 10px 30px #0005;padding:4px;opacity:0;transform:scale(.95);transition:opacity .1s ease-out,transform .1s ease-out}
.pop.in{opacity:1;transform:none}.pop.pp{width:288px;padding:16px}
.mi{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;background:none;color:inherit;font-size:14px;border-radius:calc(var(--r) - 2px);cursor:pointer;text-align:left}
.mi:hover,.mi:focus-visible{background:var(--hover);color:var(--hover-fg);box-shadow:none}.mi.dis{opacity:.5;pointer-events:none}
.mi .ck{margin-left:auto;color:var(--primary);opacity:0}.mi.sel .ck{opacity:1}
.msep{height:1px;background:var(--border);margin:4px -4px}
.mhead{display:flex;align-items:center;gap:8px;padding:6px 4px}.mhead .uinfo b{font-weight:600}
.pp h4{margin:0 0 4px;font-size:14px;font-weight:500}.pp .dd{margin:0 0 16px;color:var(--muted);font-size:12px}
.fld{margin-bottom:12px}.fld label{font-size:12px;font-weight:500;color:var(--fg);margin-bottom:4px}
.sel{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;font-size:12px;border:1px solid var(--border);border-radius:calc(var(--r) - 2px);background:var(--bg);color:var(--fg);cursor:pointer;text-align:left}.sel .nl{flex:1}.sel .sdot{width:10px;height:10px;border-radius:50%;flex:none}
.tg{display:flex;width:100%}.tg button{flex:1;height:32px;font-size:12px;border:1px solid var(--border);margin-left:-1px;background:var(--bg);color:var(--fg);cursor:pointer;transition:background-color .15s,color .15s}
.tg button:first-child{margin-left:0;border-radius:calc(var(--r) - 2px) 0 0 calc(var(--r) - 2px)}.tg button:last-child{border-radius:0 calc(var(--r) - 2px) calc(var(--r) - 2px) 0}
.tg button:hover{background:var(--hover);color:var(--hover-fg)}.tg button[aria-pressed=true]{background:var(--hover);color:var(--hover-fg);font-weight:600;position:relative;z-index:1;border-color:var(--primary)}
.tip{position:fixed;z-index:50;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 12px;border-radius:calc(var(--r) - 2px);pointer-events:none;opacity:0;transform:translateX(-4px) scale(.95);transition:opacity .1s,transform .1s}.tip.in{opacity:1;transform:none}
#pal{position:fixed;inset:0;background:#0008;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:60;opacity:0;visibility:hidden;transition:opacity .1s ease-out,visibility 0s .1s}#pal.on{opacity:1;visibility:visible;transition:opacity .1s ease-out}
#pal .box{width:min(560px,92vw);background:var(--card);border:1px solid var(--border);border-radius:calc(var(--r) + 2px);overflow:hidden;transform:scale(.95);transition:transform .1s ease-out}#pal.on .box{transform:none}
#pal input{border:0;border-bottom:1px solid var(--border);border-radius:0;padding:14px 16px;font-size:15px;background:transparent}#pal input:focus-visible{box-shadow:none}
#res{max-height:340px;overflow:auto;padding:4px}
#res h5{margin:8px 8px 4px;font-size:12px;font-weight:500;color:var(--muted)}
#res a{display:flex;align-items:center;gap:10px;padding:8px;border-radius:calc(var(--r) - 2px);cursor:pointer;color:var(--fg);text-decoration:none}#res a.h{background:var(--hover);color:var(--hover-fg)}
#res .none{padding:24px;text-align:center;color:var(--muted)}
#toast{position:fixed;right:18px;bottom:18px;z-index:70;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:calc(var(--r) - 2px);font-weight:500;transform:translateY(12px);opacity:0;pointer-events:none;transition:opacity .2s ease-out,transform .2s ease-out}#toast.on{opacity:1;transform:none}
/* ---------- data table ---------- */
.dtbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dt th{padding:14px 12px;font-weight:400;white-space:nowrap}.dt td{padding:12px;vertical-align:middle;border-color:color-mix(in srgb,var(--border) 60%,transparent)}
.dt tbody tr:hover{background:color-mix(in srgb,var(--fg) 3%,transparent)}.dt tr[data-sel=true]{background:var(--hover)}
.sort{background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0}.sort:hover{color:var(--fg)}

.pg{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13px}

/* page registry: every screen of the app is one entry. Page files (pages/*.js) call reg() and fill P / AFTER / FULL.
   kind 'page' = rendered inside the shell and listed in the sidebar; kind 'full' = a standalone screen (no shell). */
const REG=[]; const GROUPS=['Live','Output','Automation','Settings'];
function reg(o){REG.push(o)}
const pagesOf=g=>REG.filter(r=>r.kind=='page'&&r.g==g);

const flat=[]; let NAV=[];
function buildNav(){
  flat.length=0; NAV=[];
  GROUPS.forEach(g=>{
    const items=[],seen={};
    pagesOf(g).forEach(r=>{
      if(r.hidden){flat.push([r.id,r.t,g,r.ic]);return}
      if(r.parent){ if(!seen[r.parent]){seen[r.parent]={t:r.parent,ic:r.picon||r.ic,sub:[],badge:r.pbadge};items.push(seen[r.parent])} seen[r.parent].sub.push({id:r.id,t:r.t,badge:r.badge,dis:r.dis}); flat.push([r.id,r.t,g,r.ic,r.parent]) }
      else { items.push({id:r.id,t:r.t,ic:r.ic,badge:r.badge}); flat.push([r.id,r.t,g,r.ic]) }
    });
    if(items.length) NAV.push({g,items});
  });
  NAV.push({g:'Design preview',items:[{id:'screens',t:'All screens',ic:'ovl'}]}); flat.push(['screens','All screens','Design preview','ovl']);
  REG.filter(r=>r.kind=='full').forEach(r=>flat.push([r.id,r.t,'Screens',r.ic||'ovl']));
}
function injectCSS(key,css){let s=document.querySelector(`style[data-k="${key}"]`);if(!s){s=document.createElement('style');s.dataset.k=key;document.head.appendChild(s)}s.textContent=css}
const openP=new Set();
const badge=b=>b?`<span class="nbadge ${b}">${b}</span>`:'';

  let h=`<div class="qc"><button class="go" id="goBtn"></button><button class="inb" id="inbBtn" data-tip="Alerts" aria-label="Alerts">${ic('bell')}</button></div>`;

      if(it.sub){
        h+=`<div class="has${openP.has(it.t)?' open':''}" data-p="${it.t}"><button class="nb" data-tip="${it.t}" aria-expanded="${openP.has(it.t)}">${ic(it.ic)}<span class="nl">${it.t}</span>${badge(it.badge)}${ic('chev').replace('class="i"','class="i chev"')}</button><div class="subm"><div><ul>`+
          it.sub.map(s=>`<li><a href="#${s.id}" data-id="${s.id}"${s.dis?' class="dis" aria-disabled="true" tabindex="-1"':''}><span class="nl">${s.t}</span>${badge(s.badge)}</a></li>`).join('')+`</ul></div></div></div>`;

function markActive(id){
  document.querySelectorAll('#nav a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.id==id)||0);

/* preferences: same set as the reference's layout panel; persisted per browser */
const DEF={preset:'relay',mode:'dark',layout:'centered',navbar:'sticky',sb:'inset',collapse:'icon',font:'system',cl:false};
const PRESETS=[{k:'relay',l:'Relay',d:'#4ade80',li:'#15803d'},{k:'softpop',l:'Soft Pop',d:'oklch(.6801 .1583 276.93)',li:'oklch(.5106 .2301 276.97)'},{k:'tangerine',l:'Tangerine',d:'oklch(.64 .17 36.44)',li:'oklch(.64 .17 36.44)'},{k:'brutalist',l:'Brutalist',d:'oklch(.7044 .1872 23.19)',li:'oklch(.6489 .237 26.97)'}];
const FONTS=[{k:'system',l:'System UI',v:'ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif'},{k:'rounded',l:'Rounded',v:'ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif'},{k:'serif',l:'Serif',v:'ui-serif,Georgia,"Times New Roman",serif'},{k:'mono',l:'Monospace',v:'ui-monospace,SFMono-Regular,Menlo,monospace'}];
let S={...DEF};

/* generic popup (menu / popover / select list): fade + zoom 100ms, closes on outside click or Esc */
const pops=[];
function closePop(p){ if(!pops.includes(p))return; pops.splice(pops.indexOf(p),1); p.el.classList.remove('in'); p.anchor&&p.anchor.setAttribute&&p.anchor.setAttribute('aria-expanded','false'); setTimeout(()=>p.el.remove(),100); }
function closeAll(){pops.slice().forEach(closePop)}
function place(el,a,side,align){
  const r=a.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,m=8; let x,y;
  if(side=='right'){x=r.right+8;y=align=='end'?r.bottom-h:r.top;el.style.transformOrigin='left center'}
  else if(side=='top'){x=align=='end'?r.right-w:r.left;y=r.top-h-4;el.style.transformOrigin='bottom '+(align=='end'?'right':'left')}
  else{x=align=='end'?r.right-w:r.left;y=r.bottom+4;el.style.transformOrigin='top '+(align=='end'?'right':'left')}
  el.style.left=Math.max(m,Math.min(x,innerWidth-w-m))+'px'; el.style.top=Math.max(m,Math.min(y,innerHeight-h-m))+'px';
}
function menuHTML(items){return items.map((it,i)=>it.sep?'<div class="msep" role="separator"></div>':it.head?`<div class="mhead">${it.head}</div>`:`<button class="mi${it.sel?' sel':''}${it.dis?' dis':''}" role="menuitem" data-i="${i}">${it.html||((it.ic?ic(it.ic):it.dot?`<span class="sdot" style="width:10px;height:10px;border-radius:50%;background:${it.dot}"></span>`:'')+`<span>${it.t}</span>`)}${it.ck?ic('check').replace('class="i"','class="i ck"'):''}</button>`).join('')}
function popup(anchor,o){
  const el=document.createElement('div'); el.className='pop '+(o.cls||''); el.setAttribute('role',o.items?'menu':'dialog');
  if(o.w)el.style.minWidth=o.w+'px';
  el.innerHTML=o.items?menuHTML(o.items):'';
  document.body.appendChild(el);
  const p={el,anchor}; pops.push(p); anchor.setAttribute&&anchor.setAttribute('aria-expanded','true');
  if(o.items) el.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const it=o.items[+b.dataset.i];closePop(p);if(it.go)location.hash=it.go;if(it.fn)it.fn()});
