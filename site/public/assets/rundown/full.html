<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rundown</title>
<link rel="stylesheet" href="rundown.css">
<style>html,body{cursor:default}</style>
</head>
<body class="rd-full rd-fit rd-cards-person" data-view="full" data-layout="fit" data-cards="person" data-team="" data-time="" data-type="">
<div class="stage" id="stage">
  <div class="msg" id="msg" hidden></div>

  
  <div class="full" id="body">
    <div class="ruler" id="ruler"></div>
    <div class="nowcol">
      <div class="lbl"><span class="livetag" id="hLive" hidden>LIVE</span><span id="hSvc">Service</span> · <span id="hClock">–</span></div>
      <h1 class="ttl" id="hTitle">Waiting for the plan</h1>
      <div class="sub"><span class="key" id="hKey" hidden></span><span id="hLead"></span></div>
      <div class="left" id="hLeft">–</div>
      <div class="prog" id="hProg" hidden><i id="hBar"></i><em id="hFrom"></em><em id="hTo"></em></div>
      <div class="slip" id="hSlip"></div>
      <div class="then"><span class="lbl" id="hNextAt">Then</span><div class="nx" id="hNext">–</div></div>
      <div class="lbl mh" id="micsFor">On mics</div>
      <div class="fit"><div class="onmics" id="mics"></div></div>
    </div>
    <div class="rcol">
      <div class="block notesbox"><div class="lbl" id="notesH">Notes</div><div class="fit"><div class="notes" id="notes"></div></div></div>
      <div class="block rosterbox"><div class="lbl" id="teamNote">Serving without a mic</div><div class="fit"><div class="roster" id="roster"></div></div></div>
    </div>
  </div>
  
</div>
<script src="relay-ui.js"></script>
<script src="demo.js"></script>
<script src="rundown.js"></script>
</body></html>
