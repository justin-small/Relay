# The managed components this target uses. `lvgl` is the panel's drawing library, pinned to an exact
# release: a change to it is a change to every pixel the panel draws, so it is made by hand. LVGL is MIT
# licensed. `esp_lcd_qemu_rgb` is conditional: it is the virtual RGB panel the emulator suite draws to,
# and the shipped image neither needs it nor links it. The rule reads the Kconfig option directly, so a
# release build with `CONFIG_RELAY_QEMU` off does not fetch that component at all.
dependencies:
  lvgl/lvgl:
    version: "9.2.2"
  # Relay's announcement is found with mDNS browsing (`discovery.cpp`). Pinned for the same reason as LVGL.
  espressif/mdns:
    version: "1.4.3"
  espressif/esp_lcd_qemu_rgb:
    version: "1.0.2"
    rules:
      - if: "$CONFIG{RELAY_QEMU} == True"
  # The Waveshare ESP32-P4 10.1" board only (`sdkconfig.board.waveshare-p4-10.1`); the CrowPanel's build fetches
  # none of the three. The JD9365 is that board's panel controller, on MIPI-DSI (`board_dsi_jd9365.cpp`).
  espressif/esp_lcd_jd9365:
    version: "2.0.2"
    rules:
      - if: "target == esp32p4"
  # The ESP32-P4 has no radio: these two reach the ESP32-C6 on the board and give `net.cpp` its `esp_wifi`
  # calls. The versions are the newest in the ranges Waveshare name for ESP-IDF 5.x (`0.14.*` and `1.4.*`),
  # which are the ones that speak to the firmware the C6 ships with.
  espressif/esp_wifi_remote:
    version: "0.14.5"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "1.4.7"
    rules:
      - if: "target == esp32p4"
