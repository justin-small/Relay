{# /ndi/view/<source>: one NDI source in the browser (#296). Served by the NDI module on the operator port, behind
   ndi.view. Its script is /static/modules/ndi/view.js. #}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>{{ data.title }}</title>
<style>
html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 16px/1.3 system-ui, sans-serif; }
#ndv { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; border: 8px solid transparent; }
#ndv[data-tally="program"] { border-color: #e03131; }
#ndv[data-tally="preview"] { border-color: #2f9e44; }
#ndvPic { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#ndvPic img { max-width: 100%; max-height: 100%; object-fit: contain; }
#ndvBar { display: flex; gap: 16px; align-items: center; padding: 6px 10px; font-size: 14px; color: #bbb; }
#ndvBar b { color: #fff; font-weight: 600; }
#ndvMeter { flex: 0 0 120px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
#ndvMeter i { display: block; height: 100%; width: 0; background: #40c057; transition: width .15s; }
#ndvMsg { margin-left: auto; color: #fab005; }
</style>
</head>
<body>
<main id="ndv" data-tally="">
  <div id="ndvPic"><img id="ndvImg" alt="{{ data.title }}"></div>
  <div id="ndvBar"><b>{{ data.title }}</b><span>{{ data.machine }}</span><span id="ndvInfo"></span>
    <div id="ndvMeter" title="Audio level" hidden><i></i></div><span id="ndvMsg" role="status" aria-live="polite"></span></div>
</main>
<script id="ndvData" type="application/json">{{ data | tojson }}</script>
<script src="/static/modules/ndi/view.js"></script>
</body>
</html>
