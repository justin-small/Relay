{# /ndi/multiview/<id>: a saved multiview, composed on the server (#297). Its script is /static/modules/ndi/multiview.js. #}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>{{ data.title }}</title>
<style>
html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 16px/1.3 system-ui, sans-serif; }
#mv { height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
#mv img { max-width: 100%; max-height: 100%; object-fit: contain; }
#mvMsg { position: absolute; left: 10px; bottom: 6px; color: #fab005; font-size: 14px; }
</style>
</head>
<body>
<main id="mv"><img id="mvImg" alt="{{ data.title }}"><div id="mvMsg" role="status" aria-live="polite"></div></main>
<script id="mvData" type="application/json">{{ data | tojson }}</script>
<script src="/static/modules/ndi/multiview.js"></script>
</body>
</html>
