{# The Chat tab of the crew page (#230). Filled in by chat.js; every word from the server is set as text. #}
<div id="chat" class="chat">
  <div class="chat-top">
    <label class="chat-pick"><span class="chat-lbl">Channel</span> <select id="chatChannel" aria-label="Channel"></select></label>
    <label class="chat-push"><input type="checkbox" id="chatPush"> Quiet notification when I am not looking</label>
  </div>
  <div class="cr-note" id="chatNote" role="status" aria-live="polite"></div>
  <ol class="chat-list" id="chatList" aria-live="polite" aria-label="Messages"></ol>
  <form class="chat-form" id="chatForm" autocomplete="off">
    <textarea id="chatText" rows="2" maxlength="500" placeholder="Message" aria-label="Message"></textarea>
    <button type="submit" id="chatSend">Send</button>
  </form>
</div>
