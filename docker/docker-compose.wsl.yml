# Windows 11 via WSL2: reuse WSLg's PulseAudio, which already publishes the
# Windows microphone. Nothing to install -- WSLg ships with Windows 11, and
# Docker Desktop already runs on WSL2.
#
# Must be run from inside the WSL distro (start-docker.bat does this for you);
# a Docker context outside WSL cannot see /mnt/wslg.
services:
  relay:
    environment:
      PULSE_SERVER: unix:/mnt/wslg/PulseServer
    volumes:
      # Read-write: connect() on a unix socket needs write permission on the
      # socket inode, so a :ro mount here would break capture.
      - /mnt/wslg:/mnt/wslg
