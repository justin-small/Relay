# Live Caption Relay -- base. Serves the pages; no audio wiring.
#
# Audio needs one platform overlay on top of this file. Use the launchers
# (start.command / start.bat / start.sh) or the explicit form:
#
#   Linux    docker compose -f docker/docker-compose.yml -f docker/docker-compose.linux.yml up
#   macOS    docker compose -f docker/docker-compose.yml -f docker/docker-compose.macos.yml up
#   Windows  docker compose -f docker/docker-compose.yml -f docker/docker-compose.windows.yml up
#
# Ports: 80 = viewer link for the room (plain HTTP), 443 = operator panel
#        (HTTPS). Both are served by Caddy inside the container; the relay's
#        own sockets stay on loopback in the network namespace.
# State:  ../docker-config/ (project root) holds config.json (API key, admin
#         token), blocklist.txt and certs/ (the panel's TLS key and
#         certificate), so rebuilds never lose them.
services:
  relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: live-caption-relay
    container_name: live-caption-relay
    restart: unless-stopped

    # The image ships an unprivileged account (10001:10001). On a Linux host
    # the bind mount below carries real ownership, so run as the invoking user
    # instead -- the launchers export these; by hand use:
    #   RELAY_UID=$(id -u) RELAY_GID=$(id -g) docker compose ... up
    # Docker Desktop (macOS/Windows) fakes bind-mount ownership, so the
    # defaults are correct there.
    user: "${RELAY_UID:-10001}:${RELAY_GID:-10001}"

    # Hardening. The relay needs no privileged operation at all: no setuid
    # binaries, no capabilities, and nothing to write outside its state volume.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      # $HOME: the entrypoint writes ~/.asoundrc when PULSE_SERVER is set, and
      # Caddy keeps its (disposable) state under XDG_DATA_HOME here.
      - /home/relay:mode=0777,size=8m
      - /tmp:mode=1777,size=16m

    # PID 1 that reaps zombies and forwards signals, so `docker stop` is a
    # clean shutdown rather than a 10s timeout and SIGKILL.
    init: true

    # A wedged or runaway process should not be able to take the host down
    # with it. Raise these if a large room needs more headroom.
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256

    # Unbounded container logs fill the host disk. Cap and rotate them.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      # Viewer link -- published on every interface so the room can reach it.
      # Plain HTTP by design: the pages carry no secret, and a room full of
      # phones will not install a certificate to read captions.
      - "${RELAY_HTTP_PORT:-80}:8080"
      # Operator panel, over HTTPS. Also on every interface -- what protects it
      # is TLS plus the admin token, not unreachability. The certificate is
      # self-signed and generated by setup into ../docker-config/certs; setup
      # and every start print its SHA-256 fingerprint, and checking that
      # against the browser is what makes the connection mean anything.
      - "${RELAY_HTTPS_PORT:-443}:8443"
      #
      # 8000/8001 are the relay's own cleartext sockets. They stay on loopback
      # inside the network namespace and are deliberately not published: there
      # is no TLS on them, and everything they serve is reachable above.

    environment:
      RELAY_CONFIG: /app/config/config.json
      RELAY_BLOCKLIST: /app/config/blocklist.txt
      # Recorded runs, on the state volume so they survive the container and
      # can be collected from the host. Off unless enabled in the panel.
      RELAY_RECORDINGS: /app/config/recordings
      # A hostname for this machine, added to the panel certificate so the
      # browser is happy with https://<name>/admin as well as the IP address.
      # Normally answered at setup and stored as `admin_fqdn` in config.json;
      # this only overrides it for a one-off run.
      RELAY_ADMIN_FQDN: "${RELAY_ADMIN_FQDN:-}"
      # The host's LAN address, which this container cannot see for itself --
      # it only knows its own bridge address. Without it the certificate does
      # not name the address the operator's browser dials. The launchers
      # (start.command / start.bat / start.sh) fill this in; by hand, export it:
      #   RELAY_ADMIN_IPS=10.0.1.42 docker compose ... up
      RELAY_ADMIN_IPS: "${RELAY_ADMIN_IPS:-}"
      # Rehearsal mode: canned captions, no OpenAI connection, nothing billed.
      # Set it in the environment before starting: RELAY_DEMO=1 ./start.sh
      RELAY_DEMO: "${RELAY_DEMO:-}"

    volumes:
      # Single writable mount, holding config.json and blocklist.txt.
      - ../docker-config:/app/config
